name: YasinPress CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.13 release gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify runtime
        run: python -VV
      - name: Install canonical Yasin-AI
        run: |
          git clone --depth 1 --branch main https://github.com/yusi20006-max/Yasin-AI.git ../Yasin-AI
          python -m pip install -e ../Yasin-AI
      - name: Install project and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Compile source and tests
        run: python -m compileall -q yasinpress tests
      - name: Run test suite
        run: python -m pytest -q
      - name: Run Ruff
        run: python -m ruff check .
      - name: Verify CLI startup contract
        run: python -m yasinpress.cli.main --help
