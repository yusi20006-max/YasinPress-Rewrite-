name: Phase 6 Python Compatibility Matrix

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: git clone --depth 1 --branch main https://github.com/yusi20006-max/Yasin-AI.git ../Yasin-AI
      - run: python -m pip install -e ../Yasin-AI
      - run: pip install -e .
      - run: python -m pip install pytest
      - run: python -m pytest -q
