name: Python Compatibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install canonical Yasin-AI
        run: |
          git clone --depth 1 --branch main https://github.com/yusi20006-max/Yasin-AI.git ../Yasin-AI
          python -m pip install -e ../Yasin-AI

      - name: Install runtime dependencies
        run: python -m pip install -e .

      - name: Install test tooling
        run: python -m pip install pytest

      - name: Compile source and tests
        run: python -m compileall yasinpress tests

      - name: Run tests
        run: pytest -q

      - name: CLI smoke test
        run: python -m yasinpress.cli.main status
