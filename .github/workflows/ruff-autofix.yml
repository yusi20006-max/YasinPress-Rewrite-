name: Ruff Auto Fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply all safe Ruff fixes and format
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .

      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Ruff safe fixes and formatting"
          git push
