name: Ruff Auto Fix Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply safe Ruff fixes and format in workspace
        run: |
          python -m ruff check . --fix || true
          python -m ruff format .

      - name: Verify no uncommitted Ruff changes remain
        run: git diff --check && git diff --exit-code
